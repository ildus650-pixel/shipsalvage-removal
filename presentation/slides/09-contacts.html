<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; padding: 0; }
body {
  width: 720pt; height: 405pt; box-sizing: border-box;
  padding: 26pt 40pt 40pt 40pt;
  display: flex; flex-direction: column; overflow: hidden;
  background: #0A1428; font-family: Arial, sans-serif;
}
p.kicker { font-size: 10pt; font-weight: bold; color: #2FB7FF; margin: 0 0 8pt; }
h2 { font-size: 23pt; font-weight: bold; color: #F2F6FF; margin: 0 0 10pt; }
div.bar { width: 52pt; height: 3pt; background: #2FB7FF; margin: 0 0 20pt; }
.list { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 14pt; }
.row { display: flex; flex-direction: row; gap: 16pt; align-items: center; background: #101F3D; border: 1px solid #1E2F4D; border-radius: 8pt; padding: 14pt 18pt; }
img.ic { width: 24pt; height: 24pt; }
div.col2 { min-width: 0; width: 100%; }
p.l { font-size: 8pt; font-weight: bold; color: #2FB7FF; margin: 0 0 3pt; width: 100%; }
p.v { font-size: 12.5pt; font-weight: bold; color: #F2F6FF; margin: 0; width: 100%; }
p.v2 { font-size: 9pt; color: #8FA3C4; margin: 2pt 0 0; width: 100%; }
</style>
</head>
<body>
<p class="kicker">CONTACT US</p>
<h2>GET IN TOUCH</h2>
<div class="bar"></div>
<div class="list">
  <div class="row">
    <img class="ic" src="../assets/icons/phone.png" alt="phone">
    <div class="col2">
      <p class="l">PHONE</p>
      <p class="v">+7 (977) 017-04-27</p>
      <p class="v2">24/7 emergency line</p>
    </div>
  </div>
  <div class="row">
    <img class="ic" src="../assets/icons/envelope.png" alt="email">
    <div class="col2">
      <p class="l">EMAIL</p>
      <p class="v">ildus650@gmail.com</p>
      <p class="v2">Response within 24 hours</p>
    </div>
  </div>
  <div class="row">
    <img class="ic" src="../assets/icons/paperplane.png" alt="telegram">
    <div class="col2">
      <p class="l">TELEGRAM</p>
      <p class="v">@Sudopodembot</p>
      <p class="v2">t.me/Sudopodembot — fastest channel</p>
    </div>
  </div>
</div>
</body>
</html>
