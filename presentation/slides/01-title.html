<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; padding: 0; }
body {
  width: 720pt; height: 405pt; box-sizing: border-box;
  padding: 24pt 40pt 48pt 40pt;
  display: flex; flex-direction: column; overflow: hidden;
  background: #0A1428; font-family: Arial, sans-serif;
}
.wrap { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
img.logo { width: 58pt; height: 58pt; margin-bottom: 16pt; }
p.kicker { font-size: 11pt; font-weight: bold; color: #2FB7FF; margin: 0 0 12pt; }
h1 { font-size: 17pt; font-weight: bold; color: #F2F6FF; margin: 0 0 2pt; line-height: 1.2; padding-bottom: 20pt; }
h1 em { font-style: normal; color: #2FB7FF; }
div.bar { width: 64pt; height: 3pt; background: #2FB7FF; margin: 16pt 0; }
p.slogan { font-size: 10.5pt; color: #C3D2EA; margin: 0 0 8pt; }
p.meta { font-size: 10pt; color: #5B7290; margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="../assets/icons/anchor.png" alt="anchor logo">
  <p class="kicker">GLOBAL MARINE SALVAGE CONTRACTOR</p>
  <h1>Ship Salvage<br><em>&amp; Wreck Removal</em></h1>
  <div class="bar"></div>
  <p class="slogan">Up to 3,000 t &nbsp;·&nbsp; Cutting &nbsp;·&nbsp; Dewatering &nbsp;·&nbsp; Recycling</p>
  <p class="meta">15+ YEARS &nbsp;·&nbsp; 120+ PROJECTS &nbsp;·&nbsp; WORLDWIDE</p>
</div>
</body>
</html>
