<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; padding: 0; }
body {
  width: 720pt; height: 405pt; box-sizing: border-box;
  padding: 26pt 40pt 40pt 40pt;
  display: flex; flex-direction: column; overflow: hidden;
  background: #0A1428; font-family: Arial, sans-serif;
}
p.kicker { font-size: 10pt; font-weight: bold; color: #2FB7FF; margin: 0 0 8pt; }
h2 { font-size: 23pt; font-weight: bold; color: #F2F6FF; margin: 0 0 10pt; }
div.bar { width: 52pt; height: 3pt; background: #2FB7FF; margin: 0 0 18pt; }
.row { flex: 1 1 0; min-height: 0; display: flex; flex-direction: row; gap: 22pt; }
div.mapwrap { width: 356pt; height: 200pt; background: #101F3D; border: 1px solid #1E2F4D; padding: 3pt; }
img.map { width: 348pt; height: 192pt; }
.col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 16pt; }
.reg { display: flex; flex-direction: row; gap: 11pt; align-items: flex-start; }
div.dot { width: 8pt; height: 8pt; border-radius: 50%; background: #2FB7FF; margin-top: 5pt; }
p.rn { font-size: 12.5pt; font-weight: bold; color: #F2F6FF; margin: 0 0 2pt; }
p.rd { font-size: 8.5pt; color: #8FA3C4; line-height: 1.45; margin: 0; padding-bottom: 10pt; }
p.cap { font-size: 8pt; color: #5B7290; margin: 8pt 0 0; }
</style>
</head>
<body>
<p class="kicker">WHERE WE WORK</p>
<h2>GLOBAL REACH, FAR EAST ROOTS</h2>
<div class="bar"></div>
<div class="row">
  <div>
    <div class="mapwrap"><img class="map" src="../assets/map.jpg" alt="World map with operation areas"></div>
    <p class="cap">AREAS OF OPERATION — ILLUSTRATIVE MAP</p>
  </div>
  <div class="col">
    <div class="reg">
      <div class="dot"></div>
      <div>
        <p class="rn">RUSSIAN FAR EAST</p>
        <p class="rd">Home base — Primorye.</p>
      </div>
    </div>
    <div class="reg">
      <div class="dot"></div>
      <div>
        <p class="rn">SOUTHEAST ASIA</p>
        <p class="rd">Active region for projects.</p>
      </div>
    </div>
    <div class="reg">
      <div class="dot"></div>
      <div>
        <p class="rn">ATLANTIC</p>
        <p class="rd">Global coverage.</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
