<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; padding: 0; }
body {
  width: 720pt; height: 405pt; box-sizing: border-box;
  padding: 26pt 40pt 40pt 40pt;
  display: flex; flex-direction: column; overflow: hidden;
  background: #0A1428; font-family: Arial, sans-serif;
}
p.kicker { font-size: 10pt; font-weight: bold; color: #2FB7FF; margin: 0 0 8pt; }
h2 { font-size: 23pt; font-weight: bold; color: #F2F6FF; margin: 0 0 6pt; }
p.note { font-size: 8pt; color: #5B7290; margin: 0 0 12pt; }
div.bar { width: 52pt; height: 3pt; background: #2FB7FF; margin: 0 0 18pt; }
.grid { flex: 1 1 0; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 14pt; }
.chip { background: #101F3D; border: 1px solid #1E2F4D; border-radius: 8pt; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8pt; text-align: center; min-height: 0; }
p.cn { font-size: 12pt; font-weight: bold; color: #F2F6FF; margin: 0; }
p.ct { font-size: 7.5pt; font-weight: bold; color: #2FB7FF; margin: 0; }
</style>
</head>
<body>
<p class="kicker">TRUST</p>
<h2>PARTNERS AND CLIENTS</h2>
<p class="note">ILLUSTRATIVE PARTNER LOGOS</p>
<div class="bar"></div>
<div class="grid">
  <div class="chip"><p class="cn">PACIFIC PORTS ALLIANCE</p><p class="ct">PARTNER</p></div>
  <div class="chip"><p class="cn">BALTIC MARINE GROUP</p><p class="ct">PARTNER</p></div>
  <div class="chip"><p class="cn">FAR EAST SHIPPING CO.</p><p class="ct">PARTNER</p></div>
  <div class="chip"><p class="cn">NORDIC SALVAGE &amp; TOWAGE</p><p class="ct">PARTNER</p></div>
  <div class="chip"><p class="cn">GLOBAL MARINE INSURERS</p><p class="ct">PARTNER</p></div>
  <div class="chip"><p class="cn">SUEZ MARITIME SERVICES</p><p class="ct">PARTNER</p></div>
</div>
</body>
</html>
