<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; padding: 0; }
body {
  width: 720pt; height: 405pt; box-sizing: border-box;
  padding: 24pt 40pt 48pt 40pt;
  display: flex; flex-direction: column; overflow: hidden;
  background: #0A1428; font-family: Arial, sans-serif;
}
.wrap { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
p.kicker { font-size: 10pt; font-weight: bold; color: #2FB7FF; margin: 0 0 12pt; }
h1 { font-size: 28pt; font-weight: bold; color: #F2F6FF; margin: 0 0 12pt; }
p.sub { font-size: 10.5pt; color: #C3D2EA; margin: 0 0 24pt; padding-bottom: 10pt; }
div.btn { background: #2FB7FF; border-radius: 8pt; padding: 13pt 26pt; }
p.bt { font-size: 12.5pt; font-weight: bold; color: #06111F; margin: 0; }
div.bar { width: 52pt; height: 3pt; background: #2FB7FF; margin: 20pt 0; }
p.phone { font-size: 10pt; color: #8FA3C4; margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">READY WHEN YOU ARE</p>
  <h1>CONTACT US FOR A CONSULTATION</h1>
  <p class="sub">We respond within 24 hours.</p>
  <div class="btn"><p class="bt">TELEGRAM &nbsp;·&nbsp; EMAIL &nbsp;·&nbsp; PHONE</p></div>
  <div class="bar"></div>
  <p class="phone">CALL &nbsp;+7 (977) 017-04-27 &nbsp;&nbsp;·&nbsp;&nbsp; @Sudopodembot</p>
</div>
</body>
</html>
