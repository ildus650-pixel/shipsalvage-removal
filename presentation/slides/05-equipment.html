<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; padding: 0; }
body {
  width: 720pt; height: 405pt; box-sizing: border-box;
  padding: 26pt 40pt 40pt 40pt;
  display: flex; flex-direction: column; overflow: hidden;
  background: #0A1428; font-family: Arial, sans-serif;
}
p.kicker { font-size: 10pt; font-weight: bold; color: #2FB7FF; margin: 0 0 8pt; }
h2 { font-size: 23pt; font-weight: bold; color: #F2F6FF; margin: 0 0 10pt; }
div.bar { width: 52pt; height: 3pt; background: #2FB7FF; margin: 0 0 20pt; }
.grid { flex: 1 1 0; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 12pt; }
.card { background: #101F3D; border: 1px solid #1E2F4D; border-radius: 8pt; padding: 16pt 16pt; display: flex; flex-direction: row; gap: 14pt; align-items: flex-start; min-height: 0; }
p.num { font-size: 24pt; font-weight: bold; color: #2FB7FF; margin: 0; width: 46pt; }
.b { min-width: 0; display: flex; flex-direction: column; gap: 6pt; }
p.t { font-size: 12pt; font-weight: bold; color: #F2F6FF; margin: 0; }
p.d { font-size: 8.5pt; color: #8FA3C4; line-height: 1.5; margin: 0; padding-bottom: 10pt; }
</style>
</head>
<body>
<p class="kicker">CAPABILITIES</p>
<h2>FLEET AND EQUIPMENT</h2>
<div class="bar"></div>
<div class="grid">
  <div class="card">
    <p class="num">01</p>
    <div class="b">
      <p class="t">PONTOONS &amp; AIRBAGS</p>
      <p class="d">Flotation systems for lifts.</p>
    </div>
  </div>
  <div class="card">
    <p class="num">02</p>
    <div class="b">
      <p class="t">HEAVY CRANES</p>
      <p class="d">Deck and harbour cranes.</p>
    </div>
  </div>
  <div class="card">
    <p class="num">03</p>
    <div class="b">
      <p class="t">ROV SYSTEMS</p>
      <p class="d">Remote inspection, survey.</p>
    </div>
  </div>
  <div class="card">
    <p class="num">04</p>
    <div class="b">
      <p class="t">DIVING TEAMS</p>
      <p class="d">Certified divers, full gear.</p>
    </div>
  </div>
</div>
</body>
</html>
