name: Bot replies

on:
  schedule:
    # Каждые 15 минут — автопереписка бота с клиентами
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Reply to bot messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 tools/reply_bot.py || true
      - name: Commit offset
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tg_offset.json
          git diff --cached --quiet || git commit -m "Update bot offset"
          git push
