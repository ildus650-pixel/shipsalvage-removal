name: Refresh news

on:
  schedule:
    # Ежедневно в 04:30 UTC (07:30 МСК)
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch news from RSS
        run: python3 tools/fetch_news.py

      - name: Commit news.json
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Update news $(date -u +%F)"
          git push

      - name: Post to Telegram channel (if configured)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: python3 tools/post_news.py --since "$(date -u +%F)" || true
